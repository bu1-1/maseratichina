name: Salesforce Sync From Org

# Pull sandbox metadata into GitHub on a schedule.
# NOTE: Scheduled workflows only run from the default branch (main).
on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: sf-org-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Retrieve sandbox → commit to GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SF_INSTANCE_URL: https://maseratichina--all.sandbox.my.sfcrmproducts.cn
      SF_AUDIENCE_URL: https://maseratichina--all.sandbox.my.sfcrmproducts.cn
      SF_CLI_ALIAS: aliyun-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history / write token for push
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Write JWT key
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          test -n "$SF_JWT_KEY" || { echo "Missing secret SF_JWT_KEY"; exit 1; }
          mkdir -p salesforce-auth/certs
          printf '%s\n' "$SF_JWT_KEY" > salesforce-auth/certs/server.key
          chmod 600 salesforce-auth/certs/server.key

      - name: Authenticate (JWT)
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        run: |
          test -n "$SF_CLIENT_ID" || { echo "Missing secret SF_CLIENT_ID"; exit 1; }
          test -n "$SF_USERNAME" || { echo "Missing secret SF_USERNAME"; exit 1; }
          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file salesforce-auth/certs/server.key \
            --username "$SF_USERNAME" \
            --alias "$SF_CLI_ALIAS" \
            --instance-url "$SF_INSTANCE_URL" \
            --set-default

      - name: Retrieve metadata from sandbox
        run: |
          chmod +x scripts/sf-sync-from-org.sh
          ./scripts/sf-sync-from-org.sh manifest/sync-package.xml

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Never commit secrets / local auth
          rm -rf salesforce-auth/certs/server.key .sf .sfdx || true
          rm -rf force-app/main/default/labels || true

          git add -A force-app manifest
          if git diff --cached --quiet; then
            echo "No metadata changes to sync."
            exit 0
          fi

          git commit -m "[org-sync] Sync metadata from Salesforce sandbox

Automated retrieve from aliyun-all (maseratichina--all).
"
          git push origin HEAD:${{ github.ref_name }}
